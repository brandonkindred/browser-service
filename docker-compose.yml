services:
  postgres:
    image: postgres:17-alpine
    container_name: browser-service-postgres
    environment:
      POSTGRES_DB: browser_service
      POSTGRES_USER: browser_service
      POSTGRES_PASSWORD: browser_service
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U browser_service -d browser_service"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  selenium:
    image: seleniarm/standalone-chromium:latest
    container_name: browser-service-selenium
    shm_size: 2gb
    ports:
      - "4444:4444"
      - "7900:7900"
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: browser-service-api:local
    container_name: browser-service-api
    depends_on:
      postgres:
        condition: service_healthy
      selenium:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/browser_service
      DATABASE_USERNAME: browser_service
      DATABASE_PASSWORD: browser_service
      SELENIUM_GRID_URLS: http://selenium:4444/wd/hub
    ports:
      - "9999:8080"
    restart: unless-stopped

volumes:
  pgdata:
