---
quarkus:
  application:
    name: "browser-service-api"
  http:
    port: 8080
    proxy:
      proxy-address-forwarding: true
    access-log:
      enabled: true
    auth:
      permission:
        public-ops:
          paths:
          - "/healthz"
          - "/readyz"
          - "/metrics"
          - "/q/*"
          - "/v3/api-docs"
          - "/v3/api-docs/*"
          - "/swagger-ui.html"
          - "/swagger-ui/*"
          policy: "permit"
        public-ws:
          paths:
          - "/v1/ws/sessions"
          policy: "permit"
        authenticated-v1:
          paths:
          - "/v1/*"
          policy: "authenticated"
  oidc:
    application-type: "service"
    auth-server-url: "${OIDC_ISSUER_URI:https://securetoken.google.com/replace-me}"
    token:
      issuer: "${OIDC_ISSUER_URI:https://securetoken.google.com/replace-me}"
      audience: "${OIDC_AUDIENCE:browser-service}"
      principal-claim: "sub"
      refresh-expired: false
    tls:
      verification: "required"
mp:
  jwt:
    verify:
      issuer: "${OIDC_ISSUER_URI:https://securetoken.google.com/replace-me}"
      audiences: "${OIDC_AUDIENCE:browser-service}"
      publickey:
        location: "${OIDC_ISSUER_URI:https://securetoken.google.com/replace-me}/.well-known/jwks.json"
  datasource:
    db-kind: "postgresql"
    username: "${DATABASE_USERNAME:browser_service}"
    password: "${DATABASE_PASSWORD:browser_service}"
    jdbc:
      url: "${DATABASE_URL:jdbc:postgresql://localhost:5432/browser_service}"
  hibernate-orm:
    database:
      generation: "validate"
    jdbc:
      timezone: "UTC"
    log:
      format-sql: false
  flyway:
    migrate-at-start: true
    locations: "classpath:db/migration"
  smallrye-openapi:
    path: "/v3/api-docs"
  swagger-ui:
    path: "/swagger-ui.html"
    always-include: true
  micrometer:
    export:
      prometheus:
        path: "/metrics"
        enabled: true
  websockets-next:
    server:
      max-message-size: 16777216
      activate-session-context: "always"
  log:
    category:
      io.smallrye.openapi.runtime.scanner.spi:
        level: "ERROR"
        min-level: "ERROR"
'%dev':
  quarkus:
    datasource:
      db-kind: "h2"
      username: "sa"
      password: ""
      devservices:
        enabled: false
      jdbc:
        url: "jdbc:h2:mem:browser_service_dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
    flyway:
      migrate-at-start: false
    hibernate-orm:
      database:
        generation: "drop-and-create"
    oidc:
      tenant-enabled: false
'%test':
  quarkus:
    keycloak:
      devservices:
        enabled: false
    oidc:
      client-id: "browser-service"
      auth-server-url: "${keycloak.url}/realms/quarkus"
      token:
        issuer: "https://server.example.com"
        audience: "https://server.example.com"
  mp:
    jwt:
      verify:
        publickey:
          location: "${keycloak.url}/realms/quarkus/protocol/openid-connect/certs"
        issuer: "https://server.example.com"
        audiences: "https://server.example.com"
browserservice:
  session:
    idle-ttl-seconds: 300
    absolute-ttl-seconds: 1800
    max-concurrent: 20
    lock-acquire-timeout-ms: 5000
  selenium:
    urls: "${SELENIUM_GRID_URLS:http://localhost:4444/wd/hub}"
    connect-timeout-ms: 15000
    read-timeout-ms: 60000
    max-retries: 3
    implicit-wait-enabled: false
    implicit-wait-seconds: 10
  appium:
    urls: "${APPIUM_URLS:}"
    platform: "ANDROID"
    connect-timeout-ms: 60000
    max-retries: 3
  browserstack:
    enabled: false
    username: "${BROWSERSTACK_USERNAME:}"
    access-key: "${BROWSERSTACK_ACCESS_KEY:}"
    real-mobile: true
    local: false
    debug: true
  web-socket:
    path: "/v1/ws/sessions"
    command-queue-depth: 32
    idle-close-seconds: 300
    outbound-buffer-ki-b: 64
    send-time-limit-ms: 10000
    alert-push-enabled: true
    alert-poll-ms: 250
    console-push-enabled: true
    console-poll-ms: 1000
    navigation-push-enabled: true
    navigation-poll-ms: 2000
    watcher-lock-timeout-ms: 50
    max-binary-frame-bytes: 16777216
